<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SSODAYS PDF Editor</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#29282d;
}

body{
    display:flex;
    flex-direction:column;
}


/* TOP BAR */

.topbar{
    height:58px;
    flex:0 0 58px;
    background:#174b7d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    font-size:20px;
    font-weight:bold;
}

.topbar button{
    background:white;
    border:0;
    border-radius:7px;
    padding:9px 14px;
    font-size:15px;
    cursor:pointer;
}


/* EDITOR TOOLS */

.editorbar{
    min-height:52px;
    background:#323136;
    border-bottom:1px solid #111;
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px;
    overflow-x:auto;
    white-space:nowrap;
}

.editorbar button,
.editorbar label{
    height:40px;
    min-width:40px;
    border:0;
    border-radius:5px;
    background:#3d3c42;
    color:#eee;
    font-size:15px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
}

.editorbar button:hover,
.editorbar label:hover{
    background:#55535a;
}

.editorbar input[type=file]{
    display:none;
}

.sep{
    height:30px;
    width:1px;
    background:#666;
    margin:0 3px;
}

#pageInput{
    width:55px;
    height:36px;
    text-align:center;
}

#textSize{
    width:55px;
    height:36px;
    background:#3d3c42;
    color:white;
    border:1px solid #666;
    border-radius:5px;
}


/* PDF VIEWER */

#viewerContainer{
    position:relative;
    flex:1;
    overflow:hidden;
    background:#29282d;
}

#pdfFrame{
    width:100%;
    height:100%;
    border:0;
    background:#29282d;
    display:none;
}

#empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:17px;
    text-align:center;
    padding:25px;
}

#emptyBox{
    background:#333239;
    border:1px solid #4b4a50;
    border-radius:12px;
    padding:30px 22px;
    max-width:420px;
}

#emptyBox b{
    display:block;
    color:white;
    font-size:24px;
    margin-bottom:12px;
}


/* STATUS */

#status{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:#111;
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    font-size:14px;
    z-index:100;
    display:none;
}


/* ANNOTATION AREA */

.annotationOverlay{
    position:absolute;
    left:0;
    top:0;
    right:0;
    bottom:0;
    z-index:20;
    pointer-events:none;
}

.annotationCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:21;
    pointer-events:none;
}

.annotationItem{
    position:absolute;
    z-index:22;
    pointer-events:auto;
    user-select:none;
    touch-action:none;
}

.textItem{
    padding:2px 4px;
    background:transparent;
    white-space:nowrap;
    font-family:Arial,sans-serif;
    color:#111;
    cursor:move;
}

.imageItem{
    border:1px dashed #1976d2;
    cursor:move;
    overflow:hidden;
    background:rgba(255,255,255,.05);
}

.imageItem img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

.resizeHandle{
    position:absolute;
    width:14px;
    height:14px;
    right:-7px;
    bottom:-7px;
    background:#1976d2;
    border:2px solid white;
    border-radius:50%;
    cursor:nwse-resize;
}

.deleteHandle{
    position:absolute;
    right:-10px;
    top:-10px;
    width:20px;
    height:20px;
    border:0;
    border-radius:50%;
    background:#d32f2f;
    color:white;
    cursor:pointer;
}

</style>
</head>


<body>


<!-- TOP -->

<div class="topbar">

    <span>📄 PDF Editor</span>

    <button id="closeBtn">
        ✕ Close
    </button>

</div>



<!-- TOOLS -->

<div class="editorbar">

    <label title="Open PDF">

        📂 PDF

        <input
            id="pdfInput"
            type="file"
            accept=".pdf,application/pdf,application/octet-stream"
        >

    </label>


    <button id="prevBtn">
        ◀
    </button>


    <input
        id="pageInput"
        value="1"
        min="1"
        type="number"
    >


    <span style="color:#ddd">
        / <span id="pageCount">0</span>
    </span>


    <button id="nextBtn">
        ▶
    </button>


    <button id="zoomOutBtn">
        −
    </button>


    <button id="zoomInBtn">
        +
    </button>


    <button id="fitBtn">
        ↔
    </button>


    <span class="sep"></span>


    <button id="pencilBtn">
        ✎
    </button>


    <button id="highlightBtn">
        🖍
    </button>


    <button id="textBtn">
        T
    </button>


    <label title="Add Image">

        🖼

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

    </label>


    <button id="undoBtn">
        ↶
    </button>


    <button id="clearBtn">
        🗑
    </button>


    <button id="downloadBtn">
        ⬇
    </button>


    <span class="sep"></span>


    <span style="color:#bbb;font-size:13px">
        Text
    </span>


    <input
        id="textSize"
        type="number"
        min="8"
        max="120"
        value="20"
    >

</div>



<!-- VIEWER -->

<div id="viewerContainer">

    <iframe
        id="pdfFrame"
        title="PDF Viewer">
    </iframe>


    <div id="empty">

        <div id="emptyBox">

            <b>
                PDF Viewer
            </b>

            PDF चुनें और browser में edit करें।

            <br><br>

            📂 ऊपर
            <b style="display:inline;font-size:18px">
                PDF
            </b>
            बटन दबाकर PDF चुनें।

            <br><br>

            <span style="font-size:14px">

                PDF server पर upload नहीं होगी।

            </span>

        </div>

    </div>

</div>



<div id="status"></div>



<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


<script>


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const $ = id =>
document.getElementById(id);


let currentFile = null;

let pdfBytes = null;

let pdfDocument = null;

let currentPDFObjectURL = null;

let currentPage = 1;

let zoom = 1;

let annotations = {};

let undoStack = [];

let selectedTool = null;



/* ================= TOAST ================= */

function toast(message){

    const status = $("status");

    status.textContent = message;

    status.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(()=>{
            status.style.display = "none";
        },2500);
}



/* ================= LOAD PDF ================= */

async function loadPDF(file){

    if(!file){

        toast("PDF file चुनें");

        return;
    }


    const name =
        (file.name || "").toLowerCase();

    const type =
        (file.type || "").toLowerCase();


    if(
        !name.endsWith(".pdf") &&
        type !== "application/pdf" &&
        type !== "application/octet-stream" &&
        type !== ""
    ){

        toast("सिर्फ PDF file चुनें");

        return;
    }


    try{

        toast("PDF load हो रही है...");


        currentFile = file;


        pdfBytes =
            new Uint8Array(
                await file.arrayBuffer()
            );


        /* CHECK PDF */

        const header =
            new TextDecoder()
            .decode(
                pdfBytes.slice(0,5)
            );


        if(header !== "%PDF-"){

            throw new Error(
                "Not a valid PDF"
            );

        }


        /* RESET */

        annotations = {};

        undoStack = [];

        currentPage = 1;


        /* LOCAL OBJECT URL */

        if(currentPDFObjectURL){

            URL.revokeObjectURL(
                currentPDFObjectURL
            );

        }


        currentPDFObjectURL =
            URL.createObjectURL(

                new Blob(
                    [pdfBytes],
                    {
                        type:"application/pdf"
                    }
                )

            );


        /* PDF.JS VIEWER */

        const frame =
            $("pdfFrame");


        frame.src =
            "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
            encodeURIComponent(
                currentPDFObjectURL
            );


        frame.style.display =
            "block";


        $("empty").style.display =
            "none";


        /* PDF.JS DOCUMENT */

        const task =
            pdfjsLib.getDocument({
                data:pdfBytes
            });


        pdfDocument =
            await task.promise;


        $("pageCount").textContent =
            pdfDocument.numPages;


        $("pageInput").value =
            1;


        toast("PDF तैयार है");


    }catch(error){

        console.error(error);

        toast("PDF load नहीं हुई");

        alert(
            "PDF load नहीं हो पाई। कृपया सही PDF file चुनें।"
        );

    }

}



/* ================= PDF INPUT ================= */

$("pdfInput")
.addEventListener(
    "change",
    async e=>{

        const file =
            e.target.files[0];

        e.target.value = "";

        if(file){

            await loadPDF(file);

        }

    }
);



/* ================= PAGE ================= */

$("prevBtn").onclick = ()=>{

    if(!pdfDocument)
        return;

    currentPage =
        Math.max(
            1,
            currentPage - 1
        );

    $("pageInput").value =
        currentPage;

};



$("nextBtn").onclick = ()=>{

    if(!pdfDocument)
        return;

    currentPage =
        Math.min(
            pdfDocument.numPages,
            currentPage + 1
        );

    $("pageInput").value =
        currentPage;

};



$("pageInput")
.addEventListener(
    "change",
    ()=>{

        if(!pdfDocument)
            return;

        let page =
            Number(
                $("pageInput").value
            ) || 1;

        page =
            Math.max(
                1,
                Math.min(
                    pdfDocument.numPages,
                    page
                )
            );

        currentPage =
            page;

        $("pageInput").value =
            page;

    }
);



/* ================= ZOOM ================= */

$("zoomInBtn").onclick = ()=>{

    if(!pdfDocument)
        return;

    zoom += .1;

    toast(
        "Zoom " +
        Math.round(zoom*100) +
        "%"
    );

};



$("zoomOutBtn").onclick = ()=>{

    if(!pdfDocument)
        return;

    zoom =
        Math.max(
            .5,
            zoom-.1
        );

    toast(
        "Zoom " +
        Math.round(zoom*100) +
        "%"
    );

};



$("fitBtn").onclick = ()=>{

    if(!pdfDocument)
        return;

    toast("Fit width");

};



/* ================= TOOLS ================= */

$("pencilBtn").onclick = ()=>{

    selectedTool = "pencil";

    toast("✎ Pencil selected");

};



$("highlightBtn").onclick = ()=>{

    selectedTool = "highlight";

    toast("🖍 Highlight selected");

};



$("textBtn").onclick = ()=>{

    selectedTool = "text";

    toast("T Text selected");

};



/* ================= IMAGE ================= */

$("imageInput")
.addEventListener(
    "change",
    e=>{

        const file =
            e.target.files[0];

        e.target.value = "";

        if(file){

            toast(
                "Image selected"
            );

        }

    }
);



/* ================= UNDO ================= */

$("undoBtn").onclick = ()=>{

    if(undoStack.length){

        undoStack.pop();

        toast("Undo");

    }else{

        toast(
            "Undo करने के लिए कुछ नहीं है"
        );

    }

};



/* ================= CLEAR ================= */

$("clearBtn").onclick = ()=>{

    if(!pdfDocument)
        return;

    if(
        confirm(
            "Current page की editing हटाएं?"
        )
    ){

        annotations[currentPage] = [];

        toast(
            "Annotations cleared"
        );

    }

};



/* ================= DOWNLOAD ================= */

$("downloadBtn").onclick =
async ()=>{

    if(!pdfBytes){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    try{

        toast(
            "PDF तैयार हो रही है..."
        );


        const pdfDoc =
            await PDFLib.PDFDocument
            .load(pdfBytes);


        const output =
            await pdfDoc.save();


        const blob =
            new Blob(
                [output],
                {
                    type:
                    "application/pdf"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;


        const original =
            currentFile?.name ||
            "document.pdf";


        a.download =
            original.replace(
                /\.pdf$/i,
                ""
            ) +
            "_edited.pdf";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            3000
        );


        toast(
            "PDF download हो गई"
        );


    }catch(error){

        console.error(error);

        alert(
            "PDF download करते समय error आया।"
        );

    }

};



/* ================= CLOSE ================= */

$("closeBtn").onclick = ()=>{

    if(currentPDFObjectURL){

        URL.revokeObjectURL(
            currentPDFObjectURL
        );

        currentPDFObjectURL =
            null;

    }


    $("pdfFrame").src = "";


    location.href =
        "../index.html";

};


</script>

</body>

  </html>
