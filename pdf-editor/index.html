<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>SSODAYS PDF Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#525659;overflow:hidden}.topbar{height:58px;background:#0d477d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.title{font-size:20px;font-weight:700}.top-btn{border:0;background:#fff;color:#163d63;border-radius:8px;padding:11px 15px;font-size:16px;font-weight:700}.toolbar{height:58px;background:#333;display:flex;align-items:center;gap:7px;padding:7px 10px;overflow-x:auto;white-space:nowrap;position:relative;z-index:50}.tool-btn{border:0;background:#444;color:#fff;border-radius:7px;padding:10px 13px;font-size:15px;min-height:42px}.tool-btn.active{background:#0d6efd}.tool-btn.download{background:#198754}.tool-btn.danger{background:#a83232}.file-btn{display:inline-flex;align-items:center;cursor:pointer}.page-input{width:72px;height:42px;border:0;border-radius:7px;text-align:center;font-size:18px}.page-total{color:#fff;font-size:17px}#status{position:absolute;left:0;right:0;top:116px;z-index:40;background:#222;color:#fff;text-align:center;padding:5px;font-size:13px}#viewerContainer{position:absolute;top:116px;bottom:0;left:0;right:0;overflow:auto;background:#525659}#viewer{padding-bottom:40px}.page{position:relative}.edit-overlay{position:absolute;inset:0;z-index:20;pointer-events:none}.draw-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edit-item{position:absolute;pointer-events:auto;user-select:none}.edit-text{color:#111;white-space:pre-wrap;cursor:move}.edit-image-wrap{border:1px dashed transparent;cursor:move}.edit-image-wrap.selected{border:2px dashed #0d6efd}.resize-handle{position:absolute;width:14px;height:14px;right:-7px;bottom:-7px;background:#0d6efd;border-radius:50%;display:none}.edit-image-wrap.selected .resize-handle{display:block;cursor:nwse-resize}#welcome{position:absolute;z-index:45;top:116px;left:0;right:0;bottom:0;background:#525659;display:flex;align-items:center;justify-content:center;padding:20px}.welcome-box{background:#fff;border-radius:22px;padding:42px 25px;text-align:center;width:min(92%,600px);box-shadow:0 8px 30px #0005}.welcome-icon{font-size:70px}.welcome-box h1{color:#123f70;margin:8px 0;font-size:38px}.welcome-box p{font-size:21px;color:#555}.choose-btn{display:inline-block;background:#123f70;color:#fff;padding:15px 25px;border-radius:9px;font-size:20px;cursor:pointer}.welcome-box small{display:block;margin-top:25px;color:#777;font-size:16px}@media(max-width:600px){.title{font-size:17px}.top-btn{font-size:14px;padding:9px 12px}.welcome-box{padding:30px 18px}.welcome-box h1{font-size:30px}.welcome-box p{font-size:18px}}
</style>
</head>
<body>
<header class="topbar"><div class="title">📄 SSODAYS PDF Editor</div><button class="top-btn" id="closeBtn">✕ Close</button></header>
<div class="toolbar">
<label class="tool-btn file-btn">📂 PDF<input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden></label>
<button class="tool-btn" id="prevBtn">◀</button><input class="page-input" id="pageNumber" type="number" min="1" value="1"><span class="page-total">/ <span id="pageCount">0</span></span><button class="tool-btn" id="nextBtn">▶</button>
<button class="tool-btn" id="zoomOutBtn">−</button><button class="tool-btn" id="zoomInBtn">+</button><button class="tool-btn" id="fitBtn">↔ Fit</button>
<button class="tool-btn" id="pencilBtn">✏️ Pencil</button><button class="tool-btn" id="highlightBtn">🖍 Highlight</button><button class="tool-btn" id="textBtn">T Text</button>
<label class="tool-btn file-btn">🖼 Image<input id="imageInput" type="file" accept="image/*" hidden></label><button class="tool-btn" id="undoBtn">↩ Undo</button><button class="tool-btn danger" id="clearBtn">🗑 Clear</button><button class="tool-btn download" id="downloadBtn">⬇ Download</button>
</div>
<div id="status">पहले PDF चुनें।</div>
<div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
<div id="welcome"><div class="welcome-box"><div class="welcome-icon">📄</div><h1>PDF Editor</h1><p>अपनी PDF चुनें और browser में edit करें।</p><label class="choose-btn">📂 PDF चुनें<input id="welcomeInput" type="file" accept="application/pdf,.pdf" hidden></label><small>आपकी PDF server पर upload नहीं होगी।</small></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id),viewerContainer=$("viewerContainer"),viewer=$("viewer"),welcome=$("welcome"),status=$("status"),pageNumber=$("pageNumber"),pageCount=$("pageCount");
const eventBus=new pdfjsViewer.EventBus();
const linkService=new pdfjsViewer.PDFLinkService({eventBus});
const pdfViewer=new pdfjsViewer.PDFViewer({container:viewerContainer,viewer,eventBus,linkService,textLayerMode:1,annotationMode:2});
linkService.setViewer(pdfViewer);
let pdfDocument=null,pdfBytes=null,currentPage=1,currentTool=null,pages={},history=[];
function msg(x){status.textContent=x}
function state(n){return pages[n]||(pages[n]={strokes:[],texts:[],images:[],overlay:null})}
function overlayFor(pageDiv){let n=Number(pageDiv.dataset.pageNumber);if(!n)return;let o=pageDiv.querySelector(".edit-overlay");if(!o){o=document.createElement("div");o.className="edit-overlay";pageDiv.appendChild(o);state(n).overlay=o;o.onpointerdown=e=>{if(currentTool==="pencil"||currentTool==="highlight")drawStart(e,n,o)}}else state(n).overlay=o;return o}
function prepare(){document.querySelectorAll("#viewer .page").forEach(overlayFor)}
eventBus.on("pagesinit",()=>{pageCount.textContent=pdfDocument.numPages;pdfViewer.currentPageNumber=1;pdfViewer.currentScaleValue="page-width";prepare();msg("✅ PDF खुल गई।")});
eventBus.on("pagechanging",e=>{currentPage=e.pageNumber;pageNumber.value=e.pageNumber;prepare()});
eventBus.on("pagerendered",e=>{let p=document.querySelector('#viewer .page[data-page-number="'+e.pageNumber+'"]');if(p)overlayFor(p);restore(e.pageNumber)});
eventBus.on("scalechanging",()=>setTimeout(prepare,100));
async function loadPDF(file){if(!file)return;if(!file.name.toLowerCase().endsWith(".pdf")){alert("कृपया PDF file चुनें।");return}try{msg("PDF load हो रही है...");const buffer=await file.arrayBuffer();pdfBytes=new Uint8Array(buffer);pages={};history=[];const task=pdfjsLib.getDocument({data:pdfBytes});pdfDocument=await task.promise;welcome.style.display="none";pdfViewer.setDocument(pdfDocument);linkService.setDocument(pdfDocument,null);pageCount.textContent=pdfDocument.numPages;pageNumber.value=1}catch(e){console.error(e);pdfDocument=null;pdfBytes=null;pageCount.textContent="0";welcome.style.display="flex";msg("❌ PDF open नहीं हो पाई।");alert("PDF open नहीं हो पाई। दूसरी PDF से test करें।")}}
let drawing=null;
function drawStart(e,n,o){e.preventDefault();let r=o.getBoundingClientRect();drawing={n,o,type:currentTool,pts:[{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}],canvas:document.createElement("canvas")};drawing.canvas.className="draw-canvas";drawing.canvas.width=Math.max(1,r.width);drawing.canvas.height=Math.max(1,r.height);o.appendChild(drawing.canvas);preview();o.setPointerCapture?.(e.pointerId);o.addEventListener("pointermove",drawMove);o.addEventListener("pointerup",drawEnd,{once:true});o.addEventListener("pointercancel",drawEnd,{once:true})}
function drawMove(e){if(!drawing)return;let r=drawing.o.getBoundingClientRect();drawing.pts.push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});preview()}
function drawEnd(){if(!drawing)return;let s=state(drawing.n),obj={type:drawing.type,pts:drawing.pts.slice()};s.strokes.push(obj);history.push({page:drawing.n,type:"stroke",obj});drawing.o.removeEventListener("pointermove",drawMove);drawing=null}
function preview(){let c=drawing.canvas,x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.lineCap="round";x.lineJoin="round";x.strokeStyle=drawing.type==="highlight"?"rgba(255,230,0,.35)":"#111";x.lineWidth=drawing.type==="highlight"?20:3;x.beginPath();drawing.pts.forEach((p,i)=>i?x.lineTo(p.x*c.width,p.y*c.height):x.moveTo(p.x*c.width,p.y*c.height));x.stroke()}
function restore(n){let s=state(n),o=s.overlay;if(!o)return;o.querySelectorAll(".draw-canvas,.edit-item").forEach(x=>x.remove());s.strokes.forEach(st=>{let r=o.getBoundingClientRect(),c=document.createElement("canvas");c.className="draw-canvas";c.width=Math.max(1,r.width);c.height=Math.max(1,r.height);let x=c.getContext("2d");x.lineCap="round";x.lineJoin="round";x.strokeStyle=st.type==="highlight"?"rgba(255,230,0,.35)":"#111";x.lineWidth=st.type==="highlight"?20:3;x.beginPath();st.pts.forEach((p,i)=>i?x.lineTo(p.x*c.width,p.y*c.height):x.moveTo(p.x*c.width,p.y*c.height));x.stroke();o.appendChild(c)});s.texts.forEach(t=>textEl(t,o));s.images.forEach(im=>imageEl(im,o))}
function textEl(t,o){let e=document.createElement("div");e.className="edit-item edit-text";e.textContent=t.text;e.style.left=t.x*100+"%";e.style.top=t.y*100+"%";e.style.fontSize=t.size+"px";e.style.zIndex=30;o.appendChild(e);moveable(e,t,o)}
function imageEl(im,o){let w=document.createElement("div");w.className="edit-item edit-image-wrap";w.style.left=im.x*100+"%";w.style.top=im.y*100+"%";w.style.width=im.w*100+"%";w.style.height=im.h*100+"%";w.style.zIndex=30;let i=document.createElement("img");i.src=im.src;i.style.width="100%";i.style.height="100%";i.style.objectFit="contain";let h=document.createElement("div");h.className="resize-handle";w.append(i,h);o.appendChild(w);moveable(w,im,o);resizeable(w,im,o)}
function moveable(e,obj,o){e.onpointerdown=ev=>{if(currentTool)return;ev.preventDefault();ev.stopPropagation();let r=o.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=obj.x,oy=obj.y;function mv(a){obj.x=Math.max(0,Math.min(.95,ox+(a.clientX-sx)/r.width));obj.y=Math.max(0,Math.min(.95,oy+(a.clientY-sy)/r.height));e.style.left=obj.x*100+"%";e.style.top=obj.y*100+"%"}function up(){document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up)}document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up)}}
function resizeable(e,obj,o){let h=e.querySelector(".resize-handle");if(!h)return;h.onpointerdown=ev=>{ev.preventDefault();ev.stopPropagation();let r=o.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,sw=obj.w,sh=obj.h;function mv(a){obj.w=Math.max(.05,Math.min(.9,sw+(a.clientX-sx)/r.width));obj.h=Math.max(.05,Math.min(.9,sh+(a.clientY-sy)/r.height));e.style.width=obj.w*100+"%";e.style.height=obj.h*100+"%"}function up(){document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up)}document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up)}}
function tool(t){currentTool=currentTool===t?null:t;["pencilBtn","highlightBtn"].forEach(id=>$(id).classList.remove("active"));if(currentTool==="pencil")$("pencilBtn").classList.add("active");if(currentTool==="highlight")$("highlightBtn").classList.add("active");msg(currentTool?"Tool: "+currentTool:"Tool बंद है।")}
function addText(){if(!pdfDocument)return alert("पहले PDF चुनें।");let text=prompt("PDF में क्या text लिखना है?");if(!text)return;let size=Number(prompt("Text size (12/18/26/36)","18"))||18,obj={text,x:.1,y:.1,size},s=state(currentPage);s.texts.push(obj);history.push({page:currentPage,type:"text",obj});restore(currentPage);currentTool=null}
function addImage(file){if(!pdfDocument)return alert("पहले PDF चुनें।");let r=new FileReader();r.onload=()=>{let obj={src:r.result,x:.1,y:.1,w:.3,h:.2};state(currentPage).images.push(obj);history.push({page:currentPage,type:"image",obj});restore(currentPage)};r.readAsDataURL(file)}
function undo(){let h=history.pop();if(!h)return;let s=state(h.page),a=h.type==="stroke"?s.strokes:h.type==="text"?s.texts:s.images,i=a.indexOf(h.obj);if(i>=0)a.splice(i,1);restore(h.page)}
function clearPage(){let s=state(currentPage);s.strokes=[];s.texts=[];s.images=[];history=history.filter(x=>x.page!==currentPage);restore(currentPage)}
async function downloadPDF(){if(!pdfBytes)return alert("पहले PDF चुनें।");try{msg("Edited PDF तैयार हो रही है...");let doc=await PDFLib.PDFDocument.load(pdfBytes),ps=doc.getPages();for(let n=1;n<=ps.length;n++){let s=pages[n];if(!s)continue;let p=ps[n-1],W=p.getWidth(),H=p.getHeight();for(let st of s.strokes)for(let i=1;i<st.pts.length;i++){let a=st.pts[i-1],b=st.pts[i];p.drawLine({start:{x:a.x*W,y:H-a.y*H},end:{x:b.x*W,y:H-b.y*H},thickness:st.type==="highlight"?12:2.5,color:st.type==="highlight"?PDFLib.rgb(1,.9,0):PDFLib.rgb(.05,.05,.05),opacity:st.type==="highlight"?.35:1})}for(let t of s.texts)p.drawText(t.text,{x:t.x*W,y:H-t.y*H-t.size,size:t.size,color:PDFLib.rgb(0,0,0)});for(let im of s.images){try{let b=await fetch(im.src).then(r=>r.arrayBuffer()),e=im.src.startsWith("data:image/png")?await doc.embedPng(b):await doc.embedJpg(b);p.drawImage(e,{x:im.x*W,y:H-im.y*H-im.h*H,width:im.w*W,height:im.h*H})}catch(e){console.error(e)}}}let out=await doc.save(),u=URL.createObjectURL(new Blob([out],{type:"application/pdf"})),a=document.createElement("a");a.href=u;a.download="SSODAYS-Edited.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);msg("✅ PDF download हो गई।")}catch(e){console.error(e);msg("❌ PDF export में error आया।");alert("PDF export नहीं हो पाई।")}}
pdfInput.onchange=e=>{let f=e.target.files[0];if(f)loadPDF(f);e.target.value=""};welcomeInput.onchange=e=>{let f=e.target.files[0];if(f)loadPDF(f);e.target.value=""};imageInput.onchange=e=>{let f=e.target.files[0];if(f)addImage(f);e.target.value=""};$("pencilBtn").onclick=()=>tool("pencil");$("highlightBtn").onclick=()=>tool("highlight");$("textBtn").onclick=addText;$("undoBtn").onclick=undo;$("clearBtn").onclick=clearPage;$("downloadBtn").onclick=downloadPDF;$("prevBtn").onclick=()=>{if(pdfDocument)pdfViewer.currentPageNumber=Math.max(1,pdfViewer.currentPageNumber-1)};$("nextBtn").onclick=()=>{if(pdfDocument)pdfViewer.currentPageNumber=Math.min(pdfDocument.numPages,pdfViewer.currentPageNumber+1)};pageNumber.onchange=()=>{if(pdfDocument)pdfViewer.currentPageNumber=Math.max(1,Math.min(pdfDocument.numPages,Number(pageNumber.value)||1))};$("zoomInBtn").onclick=()=>{if(pdfDocument)pdfViewer.currentScaleValue=String(Math.min(5,pdfViewer.currentScale*1.25))};$("zoomOutBtn").onclick=()=>{if(pdfDocument)pdfViewer.currentScaleValue=String(Math.max(.5,pdfViewer.currentScale*.8))};$("fitBtn").onclick=()=>{if(pdfDocument)pdfViewer.currentScaleValue="page-width"};$("closeBtn").onclick=()=>location.href="../index.html";window.onresize=()=>setTimeout(prepare,150);
</script>
</body>
</html>
