<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
>

<title>SSODAYS PDF Editor</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css"
>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <div class="title">
        📄 SSODAYS PDF Editor
    </div>

    <button id="closeBtn" class="top-btn">
        ✕ Close
    </button>

</header>


<div class="toolbar">

    <label class="tool-btn file-btn">
        📂 PDF
        <input
            type="file"
            id="pdfInput"
            accept="application/pdf"
            hidden
        >
    </label>

    <button id="prevBtn" class="tool-btn">
        ◀
    </button>

    <input
        id="pageNumber"
        class="page-input"
        type="number"
        value="1"
        min="1"
    >

    <span class="page-total">
        / <span id="pageCount">0</span>
    </span>

    <button id="nextBtn" class="tool-btn">
        ▶
    </button>

    <button id="zoomOutBtn" class="tool-btn">
        −
    </button>

    <button id="zoomInBtn" class="tool-btn">
        +
    </button>

    <button id="fitBtn" class="tool-btn">
        ↔ Fit
    </button>

    <button id="pencilBtn" class="tool-btn edit-btn">
        ✏️ Pencil
    </button>

    <button id="highlightBtn" class="tool-btn edit-btn">
        🖍 Highlight
    </button>

    <button id="textBtn" class="tool-btn edit-btn">
        T Text
    </button>

    <label class="tool-btn edit-btn">
        🖼 Image
        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >
    </label>

    <button id="undoBtn" class="tool-btn">
        ↩ Undo
    </button>

    <button id="clearBtn" class="tool-btn danger">
        🗑 Clear
    </button>

    <button id="downloadBtn" class="tool-btn download">
        ⬇ Download
    </button>

</div>


<div id="status">
    पहले PDF चुनें।
</div>


<div id="viewerContainer">

    <div id="viewer" class="pdfViewer"></div>

</div>


<div id="welcome">

    <div class="welcome-box">

        <div class="welcome-icon">
            📄
        </div>

        <h2>PDF Editor</h2>

        <p>
            अपनी PDF चुनें और browser में edit करें।
        </p>

        <label class="choose-btn">

            📂 PDF चुनें

            <input
                type="file"
                id="welcomeInput"
                accept="application/pdf"
                hidden
            >

        </label>

        <small>
            आपकी PDF server पर upload नहीं होगी।
        </small>

    </div>

</div>


<div id="textPopup" class="popup" hidden>

    <div class="popup-title">
        Text जोड़ें
    </div>

    <textarea
        id="textValue"
        placeholder="यहाँ text लिखें..."
    ></textarea>

    <div class="popup-row">

        <select id="textSize">

            <option value="12">
                Small
            </option>

            <option value="18" selected>
                Medium
            </option>

            <option value="26">
                Large
            </option>

            <option value="36">
                Extra Large
            </option>

        </select>

        <button id="addTextBtn">
            Add
        </button>

        <button id="cancelTextBtn">
            Cancel
        </button>

    </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="script.js"></script>

</body>
</html>
