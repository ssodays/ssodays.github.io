<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SSODAYS PDF Editor</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#29282d;
}

body{
    display:flex;
    flex-direction:column;
}


/* ================= TOP ================= */

.topbar{
    height:58px;
    flex:0 0 58px;
    background:#174b7d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    font-size:20px;
    font-weight:bold;
}

.topbar button{
    background:white;
    color:#222;
    border:0;
    border-radius:8px;
    padding:9px 14px;
    font-size:15px;
}


/* ================= TOOLBAR ================= */

.editorbar{
    min-height:52px;
    background:#323136;
    border-bottom:1px solid #111;
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px;
    overflow-x:auto;
    white-space:nowrap;
}

.editorbar button,
.editorbar label{
    height:40px;
    min-width:40px;
    border:0;
    border-radius:5px;
    background:#3d3c42;
    color:#eee;
    font-size:15px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
}

.editorbar button.active{
    background:#174b7d;
}

.editorbar input[type=file]{
    display:none;
}

.sep{
    height:30px;
    width:1px;
    background:#666;
    margin:0 3px;
}

#pageInput{
    width:55px;
    height:36px;
    text-align:center;
}

#textSize{
    width:55px;
    height:36px;
    background:#3d3c42;
    color:white;
    border:1px solid #666;
    border-radius:5px;
    text-align:center;
}


/* ================= VIEWER ================= */

#viewerContainer{
    position:relative;
    flex:1;
    overflow:auto;
    background:#29282d;
    -webkit-overflow-scrolling:touch;
    padding:12px 0 30px;
}

#pages{
    width:100%;
}

.pdfPage{
    position:relative;
    margin:0 auto 15px;
    background:white;
    box-shadow:0 2px 12px rgba(0,0,0,.5);
}

.pdfCanvas{
    display:block;
    width:100%;
    height:auto;
}

.annotationLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.annotationLayer.active{
    pointer-events:auto;
}

.annText{
    position:absolute;
    color:#111;
    white-space:nowrap;
    font-family:Arial,sans-serif;
    cursor:move;
    user-select:none;
}

.annImage{
    position:absolute;
    border:1px dashed #1976d2;
}

.annImage img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.drawCanvas{
    position:absolute;
    inset:0;
    pointer-events:none;
}


/* ================= EMPTY ================= */

#empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    text-align:center;
    padding:25px;
}

#emptyBox{
    background:#333239;
    border:1px solid #4b4a50;
    border-radius:12px;
    padding:30px 22px;
    max-width:420px;
}

#emptyBox b{
    display:block;
    color:white;
    font-size:25px;
    margin-bottom:12px;
}


/* ================= STATUS ================= */

#status{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    background:#111;
    color:white;
    padding:8px 14px;
    border-radius:20px;
    font-size:14px;
    z-index:100;
    display:none;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .topbar{
        height:52px;
        flex-basis:52px;
        font-size:17px;
    }

    .topbar button{
        padding:7px 10px;
        font-size:13px;
    }

    .editorbar{
        min-height:48px;
    }

    .editorbar button,
    .editorbar label{
        height:38px;
        min-width:38px;
        padding:0 8px;
    }

}

</style>

</head>


<body>


<!-- ================= TOP ================= -->

<div class="topbar">

    <span>
        📄 PDF Editor
    </span>

    <button id="closeBtn">
        ✕ Close
    </button>

</div>



<!-- ================= TOOLBAR ================= -->

<div class="editorbar">

    <label title="Open PDF">

        📂 PDF

        <input
            id="pdfInput"
            type="file"
            accept=".pdf,application/pdf,application/octet-stream"
        >

    </label>


    <button id="prevBtn">
        ◀
    </button>


    <input
        id="pageInput"
        type="number"
        min="1"
        value="1"
    >


    <span style="color:#ddd">
        /
        <span id="pageCount">0</span>
    </span>


    <button id="nextBtn">
        ▶
    </button>


    <button id="zoomOutBtn">
        −
    </button>


    <button id="zoomInBtn">
        +
    </button>


    <button id="fitBtn">
        ↔
    </button>


    <span class="sep"></span>


    <button id="pencilBtn">
        ✎
    </button>


    <button id="highlightBtn">
        🖍
    </button>


    <button id="textBtn">
        T
    </button>


    <label title="Add Image">

        🖼

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

    </label>


    <button id="undoBtn">
        ↶
    </button>


    <button id="clearBtn">
        🗑
    </button>


    <button id="downloadBtn">
        ⬇
    </button>


    <span class="sep"></span>


    <span style="color:#bbb;font-size:13px">
        Text
    </span>


    <input
        id="textSize"
        type="number"
        min="8"
        max="100"
        value="20"
    >

</div>



<!-- ================= VIEWER ================= -->

<div id="viewerContainer">

    <div id="pages"></div>


    <div id="empty">

        <div id="emptyBox">

            <b>
                PDF Viewer
            </b>

            PDF चुनें और browser में edit करें।

            <br><br>

            📂 ऊपर
            <b style="display:inline;font-size:18px">
                PDF
            </b>
            बटन दबाकर PDF चुनें।

            <br><br>

            <span style="font-size:14px">
                PDF server पर upload नहीं होगी।
            </span>

        </div>

    </div>

</div>



<div id="status"></div>



<!-- ================= LIBRARIES ================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


<script>


/* ================= PDF.JS ================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* ================= VARIABLES ================= */

let pdfDocument = null;

let currentFile = null;

let pdfBytes = null;

let currentPage = 1;

let scale = 1.25;

let tool = null;

let annotations = {};

let history = [];

let drawing = false;

let currentStroke = [];

let startX = 0;

let startY = 0;



const $ = id =>
document.getElementById(id);



/* ================= STATUS ================= */

function toast(text){

    const box = $("status");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.statusTimer);

    window.statusTimer =
        setTimeout(()=>{

            box.style.display = "none";

        },2200);

}



/* ================= SAVE HISTORY ================= */

function saveHistory(){

    history.push(
        JSON.stringify(annotations)
    );

    if(history.length > 30){

        history.shift();

    }

}



/* ================= LOAD PDF ================= */

async function loadPDF(file){

    if(!file){

        return;

    }


    try{

        toast("PDF load हो रही है...");


        currentFile = file;


        const buffer =
            await file.arrayBuffer();


        pdfBytes =
            new Uint8Array(buffer);


        /* PDF HEADER CHECK */

        const header =
            new TextDecoder()
            .decode(
                pdfBytes.slice(0,5)
            );


        if(header !== "%PDF-"){

            alert(
                "यह valid PDF file नहीं है।"
            );

            return;

        }


        /* RESET */

        annotations = {};

        history = [];

        currentPage = 1;


        /* PDF.JS */

        const task =
            pdfjsLib.getDocument({
                data:pdfBytes
            });


        pdfDocument =
            await task.promise;


        $("pageCount").textContent =
            pdfDocument.numPages;


        $("pageInput").value =
            1;


        $("empty").style.display =
            "none";


        await renderAllPages();


        toast("PDF तैयार है");


    }catch(error){

        console.error(error);

        alert(
            "PDF open नहीं हो पाई।"
        );

        toast(
            "PDF load error"
        );

    }

}



/* ================= FILE INPUT ================= */

$("pdfInput")
.addEventListener(
    "change",
    async function(e){

        const file =
            e.target.files[0];

        e.target.value = "";

        if(file){

            await loadPDF(file);

        }

    }
);



/* ================= RENDER ALL ================= */

async function renderAllPages(){

    const pages =
        $("pages");

    pages.innerHTML = "";


    for(
        let pageNumber = 1;
        pageNumber <= pdfDocument.numPages;
        pageNumber++
    ){

        await renderPage(
            pageNumber
        );

    }

}



/* ================= RENDER PAGE ================= */

async function renderPage(pageNumber){

    const page =
        await pdfDocument.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale:scale
        });


    const pageBox =
        document.createElement("div");


    pageBox.className =
        "pdfPage";


    pageBox.dataset.page =
        pageNumber;


    pageBox.style.width =
        viewport.width + "px";


    pageBox.style.height =
        viewport.height + "px";


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.className =
        "pdfCanvas";


    const ctx =
        canvas.getContext("2d");


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    pageBox.appendChild(
        canvas
    );


    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "annotationLayer";


    overlay.dataset.page =
        pageNumber;


    pageBox.appendChild(
        overlay
    );


    $("pages").appendChild(
        pageBox
    );


    await page.render({

        canvasContext:ctx,

        viewport:viewport

    }).promise;


    drawAnnotations(
        pageNumber,
        pageBox,
        overlay
    );


    setupDrawing(
        pageNumber,
        pageBox,
        overlay
    );

}



/* ================= ANNOTATION DRAW ================= */

function drawAnnotations(
    pageNumber,
    pageBox,
    overlay
){

    overlay.innerHTML = "";


    const list =
        annotations[pageNumber] || [];


    list.forEach(item=>{


        if(item.type === "text"){

            const el =
                document.createElement(
                    "div"
                );


            el.className =
                "annText";


            el.textContent =
                item.text;


            el.style.left =
                (item.x * 100) + "%";


            el.style.top =
                (item.y * 100) + "%";


            el.style.fontSize =
                item.size + "px";


            overlay.appendChild(
                el
            );

        }


        if(item.type === "image"){

            const el =
                document.createElement(
                    "div"
                );


            el.className =
                "annImage";


            el.style.left =
                (item.x * 100) + "%";


            el.style.top =
                (item.y * 100) + "%";


            el.style.width =
                (item.w * 100) + "%";


            el.style.height =
                (item.h * 100) + "%";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                item.src;


            el.appendChild(
                img
            );


            overlay.appendChild(
                el
            );

        }

    });

}



/* ================= DRAWING ================= */

function setupDrawing(
    pageNumber,
    pageBox,
    overlay
){

    pageBox.addEventListener(
        "pointerdown",
        function(e){

            if(
                tool !== "pencil" &&
                tool !== "highlight"
            ){

                return;

            }


            e.preventDefault();


            saveHistory();


            drawing = true;


            const rect =
                pageBox.getBoundingClientRect();


            startX =
                (e.clientX - rect.left) /
                rect.width;


            startY =
                (e.clientY - rect.top) /
                rect.height;


            currentStroke = [{

                x:startX,

                y:startY

            }];

        }
    );


    pageBox.addEventListener(
        "pointermove",
        function(e){

            if(!drawing){

                return;

            }


            const rect =
                pageBox.getBoundingClientRect();


            const x =
                (e.clientX - rect.left) /
                rect.width;


            const y =
                (e.clientY - rect.top) /
                rect.height;


            currentStroke.push({

                x:x,

                y:y

            });


            redrawStroke(
                pageBox,
                currentStroke
            );

        }
    );


    pageBox.addEventListener(
        "pointerup",
        function(){

            if(!drawing){

                return;

            }


            drawing = false;


            if(
                !annotations[pageNumber]
            ){

                annotations[pageNumber] =
                    [];

            }


            annotations[pageNumber]
            .push({

                type:tool,

                points:
                    currentStroke

            });


            currentStroke = [];


            renderPageAgain(
                pageNumber
            );

        }
    );

}



/* ================= REDRAW STROKE ================= */

function redrawStroke(
    pageBox,
    points
){

    let canvas =
        pageBox.querySelector(
            ".drawCanvas"
        );


    if(!canvas){

        canvas =
            document.createElement(
                "canvas"
            );

        canvas.className =
            "drawCanvas";

        canvas.width =
            pageBox.clientWidth;

        canvas.height =
            pageBox.clientHeight;

        pageBox.appendChild(
            canvas
        );

    }


    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(points.length < 2){

        return;

    }


    ctx.beginPath();


    points.forEach(
        (p,i)=>{

            const x =
                p.x *
                canvas.width;


            const y =
                p.y *
                canvas.height;


            if(i === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    if(
        tool === "highlight"
    ){

        ctx.strokeStyle =
            "rgba(255,230,0,.45)";

        ctx.lineWidth = 18;

    }else{

        ctx.strokeStyle =
            "#e53935";

        ctx.lineWidth = 3;

    }


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";


    ctx.stroke();

}



/* ================= RENDER AGAIN ================= */

async function renderPageAgain(
    pageNumber
){

    const old =
        document.querySelector(
            `.pdfPage[data-page="${pageNumber}"]`
        );


    if(old){

        old.remove();

    }


    const pages =
        $("pages");


    const page =
        await pdfDocument.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale:scale
        });


    const pageBox =
        document.createElement(
            "div"
        );


    pageBox.className =
        "pdfPage";


    pageBox.dataset.page =
        pageNumber;


    pageBox.style.width =
        viewport.width + "px";


    pageBox.style.height =
        viewport.height + "px";


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.className =
        "pdfCanvas";


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    pageBox.appendChild(
        canvas
    );


    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "annotationLayer";


    pageBox.appendChild(
        overlay
    );


    pages.appendChild(
        pageBox
    );


    await page.render({

        canvasContext:
            canvas.getContext("2d"),

        viewport:viewport

    }).promise;


    drawAnnotations(
        pageNumber,
        pageBox,
        overlay
    );


    setupDrawing(
        pageNumber,
        pageBox,
        overlay
    );

}



/* ================= TOOL SELECTION ================= */

function selectTool(name){

    tool =
        name;


    document
    .querySelectorAll(
        ".editorbar button"
    )
    .forEach(
        b =>
        b.classList.remove(
            "active"
        )
    );


    if(name === "pencil"){

        $("pencilBtn")
        .classList.add("active");

        toast(
            "✎ Pencil selected"
        );

    }


    if(name === "highlight"){

        $("highlightBtn")
        .classList.add("active");

        toast(
            "🖍 Highlight selected"
        );

    }


    if(name === "text"){

        $("textBtn")
        .classList.add("active");

        toast(
            "Text के लिए PDF पर tap करें"
        );

    }

}



/* ================= PENCIL ================= */

$("pencilBtn").onclick =
function(){

    selectTool(
        "pencil"
    );

};



/* ================= HIGHLIGHT ================= */

$("highlightBtn").onclick =
function(){

    selectTool(
        "highlight"
    );

};



/* ================= TEXT ================= */

$("textBtn").onclick =
function(){

    selectTool(
        "text"
    );

};



/* ================= TEXT CLICK ================= */

$("pages").addEventListener(
    "click",
    function(e){

        if(
            tool !== "text"
        ){

            return;

        }


        const pageBox =
            e.target.closest(
                ".pdfPage"
            );


        if(!pageBox){

            return;

        }


        const pageNumber =
            Number(
                pageBox.dataset.page
            );


        const rect =
            pageBox.getBoundingClientRect();


        const x =
            (e.clientX - rect.left) /
            rect.width;


        const y =
            (e.clientY - rect.top) /
            rect.height;


        const text =
            prompt(
                "Text लिखें:"
            );


        if(!text){

            return;

        }


        saveHistory();


        if(
            !annotations[pageNumber]
        ){

            annotations[pageNumber] =
                [];

        }


        annotations[pageNumber]
.push({

    type:"text",

    text:text,

    x:x,

    y:y,

    size:
        Number(
            $("textSize").value
        ) || 20

});


renderPageAgain(
    pageNumber
);

}
);



/* ================= IMAGE ================= */

$("imageInput")
.addEventListener(
    "change",
    function(e){

        const file =
            e.target.files[0];


        e.target.value = "";


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
        async function(){

            const pageNumber =
                currentPage;


            saveHistory();


            if(
                !annotations[pageNumber]
            ){

                annotations[pageNumber] =
                    [];

            }


            annotations[pageNumber]
            .push({

                type:"image",

                src:
                    reader.result,

                x:.25,

                y:.25,

                w:.5,

                h:.3

            });


            await renderPageAgain(
                pageNumber
            );


            toast(
                "Image added"
            );

        };


        reader.readAsDataURL(
            file
        );

    }
);



/* ================= PAGE BUTTONS ================= */

$("prevBtn").onclick =
async function(){

    if(!pdfDocument){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    if(currentPage <= 1){

        return;

    }


    currentPage--;


    $("pageInput").value =
        currentPage;


    const page =
        document.querySelector(
            `.pdfPage[data-page="${currentPage}"]`
        );


    if(page){

        page.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }

};



$("nextBtn").onclick =
async function(){

    if(!pdfDocument){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    if(
        currentPage >=
        pdfDocument.numPages
    ){

        return;

    }


    currentPage++;


    $("pageInput").value =
        currentPage;


    const page =
        document.querySelector(
            `.pdfPage[data-page="${currentPage}"]`
        );


    if(page){

        page.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }

};



/* ================= PAGE INPUT ================= */

$("pageInput")
.addEventListener(
    "change",
    function(){

        if(!pdfDocument){

            return;

        }


        let n =
            Number(
                this.value
            ) || 1;


        n =
            Math.max(
                1,
                Math.min(
                    pdfDocument.numPages,
                    n
                )
            );


        currentPage =
            n;


        this.value =
            n;


        const page =
            document.querySelector(
                `.pdfPage[data-page="${n}"]`
            );


        if(page){

            page.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        }

    }
);



/* ================= ZOOM IN ================= */

$("zoomInBtn").onclick =
async function(){

    if(!pdfDocument){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    scale += .15;


    await renderAllPages();


    toast(
        "Zoom " +
        Math.round(scale*100) +
        "%"
    );

};



/* ================= ZOOM OUT ================= */

$("zoomOutBtn").onclick =
async function(){

    if(!pdfDocument){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    scale =
        Math.max(
            .5,
            scale-.15
        );


    await renderAllPages();


    toast(
        "Zoom " +
        Math.round(scale*100) +
        "%"
    );

};



/* ================= FIT ================= */

$("fitBtn").onclick =
async function(){

    if(!pdfDocument){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    const firstPage =
        await pdfDocument.getPage(1);


    const unscaled =
        firstPage.getViewport({
            scale:1
        });


    const available =
        $("viewerContainer")
        .clientWidth - 25;


    scale =
        available /
        unscaled.width;


    await renderAllPages();


    toast(
        "Fit width"
    );

};



/* ================= UNDO ================= */

$("undoBtn").onclick =
async function(){

    if(!history.length){

        toast(
            "Undo करने के लिए कुछ नहीं है"
        );

        return;

    }


    annotations =
        JSON.parse(
            history.pop()
        );


    await renderAllPages();


    toast(
        "Undo"
    );

};



/* ================= CLEAR ================= */

$("clearBtn").onclick =
async function(){

    if(!pdfDocument){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    if(
        !confirm(
            "सभी editing हटाएं?"
        )
    ){

        return;

    }


    saveHistory();


    annotations = {};


    await renderAllPages();


    toast(
        "Editing clear हो गई"
    );

};



/* ================= DOWNLOAD ================= */

$("downloadBtn").onclick =
async function(){

    if(!pdfBytes){

        toast(
            "पहले PDF चुनें"
        );

        return;

    }


    try{

        toast(
            "Edited PDF बन रही है..."
        );


        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(
                pdfBytes
            );


        const pages =
            pdfDoc.getPages();


        for(
            let i=0;
            i<pages.length;
            i++
        ){

            const pdfPage =
                pages[i];


            const pageNumber =
                i+1;


            const list =
                annotations[
                    pageNumber
                ] || [];


            const width =
                pdfPage.getWidth();


            const height =
                pdfPage.getHeight();


            for(
                const item of list
            ){

                if(
                    item.type ===
                    "text"
                ){

                    pdfPage.drawText(
                        item.text,
                        {

                            x:
                                item.x *
                                width,

                            y:
                                height -
                                (
                                    item.y *
                                    height
                                ) -
                                item.size,

                            size:
                                item.size

                        }
                    );

                }


                if(
                    item.type ===
                    "image"
                ){

                    try{

                        let image;


                        if(
                            item.src
                            .startsWith(
                                "data:image/png"
                            )
                        ){

                            image =
                                await pdfDoc
                                .embedPng(
                                    item.src
                                );

                        }else{

                            image =
                                await pdfDoc
                                .embedJpg(
                                    item.src
                                );

                        }


                        pdfPage.drawImage(
                            image,
                            {

                                x:
                                    item.x *
                                    width,

                                y:
                                    height -
                                    (
                                        (
                                            item.y +
                                            item.h
                                        ) *
                                        height
                                    ),

                                width:
                                    item.w *
                                    width,

                                height:
                                    item.h *
                                    height

                            }
                        );

                    }catch(err){

                        console.warn(
                            "Image export error",
                            err
                        );

                    }

                }

            }

        }


        const output =
            await pdfDoc.save();


        const blob =
            new Blob(
                [output],
                {
                    type:
                    "application/pdf"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        const name =
            currentFile &&
            currentFile.name
            ?
            currentFile.name
            :
            "document.pdf";


        a.download =
            name.replace(
                /\.pdf$/i,
                ""
            ) +
            "_edited.pdf";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            3000
        );


        toast(
            "Edited PDF download हो गई"
        );


    }catch(error){

        console.error(error);


        alert(
            "Edited PDF बनाते समय error आया।"
        );

    }

};

/* ================= SCROLL PAGE TRACK ================= */

$("viewerContainer")
.addEventListener(
    "scroll",
    function(){

        const pageElements =
            document.querySelectorAll(
                ".pdfPage"
            );


        let closest =
            1;


        let distance =
            Infinity;


        pageElements.forEach(
            page=>{

                const rect =
                    page.getBoundingClientRect();


                const d =
                    Math.abs(
                        rect.top -
                        70
                    );


                if(d < distance){

                    distance = d;

                    closest =
                        Number(
                            page.dataset.page
                        );

                }

            }
        );


        currentPage =
            closest;


        $("pageInput").value =
            closest;

    }
);


</script>
