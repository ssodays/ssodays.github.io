<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDF Editor - SSODAYS</title>


    <!-- PDF.js Viewer CSS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="header-left">

        <h1>PDF Viewer</h1>

    </div>


    <button
        id="closeBtn"
        class="close-btn"
    >
        ✕ Close
    </button>

</header>



<!-- ================= TOOLBAR ================= -->

<div class="pdf-toolbar">


    <!-- Open PDF -->

    <label
        for="pdfInput"
        class="toolbar-icon"
        title="Open PDF"
    >
        📂
    </label>

    <input
        type="file"
        id="pdfInput"
        accept="application/pdf,.pdf"
        hidden
    >


    <!-- Search -->

    <button
        id="searchBtn"
        class="toolbar-icon"
        title="Search"
    >
        🔍
    </button>


    <!-- Page Number -->

    <input
        id="pageNumber"
        class="page-number"
        type="number"
        value="1"
        min="1"
    >


    <span
        id="pageCount"
        class="page-count"
    >
        / 0
    </span>


    <!-- Zoom Out -->

    <button
        id="zoomOut"
        class="toolbar-icon"
        title="Zoom Out"
    >
        −
    </button>


    <!-- Zoom In -->

    <button
        id="zoomIn"
        class="toolbar-icon"
        title="Zoom In"
    >
        +
    </button>


    <!-- Pencil -->

    <button
        id="pencilBtn"
        class="toolbar-icon"
        title="Pencil"
    >
        ✏️
    </button>


    <!-- Text -->

    <button
        id="textBtn"
        class="toolbar-icon"
        title="Text"
    >
        T
    </button>


    <!-- Highlight -->

    <button
        id="highlightBtn"
        class="toolbar-icon"
        title="Highlight"
    >
        🖍️
    </button>


    <!-- Image -->

    <label
        for="imageInput"
        class="toolbar-icon"
        title="Add Image"
    >
        🖼️
    </label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >


    <!-- More -->

    <button
        id="moreBtn"
        class="toolbar-icon"
        title="More"
    >
        »
    </button>


</div>



<!-- ================= SEARCH BOX ================= -->

<div
    id="searchBox"
    class="search-box"
    hidden
>

    <input
        id="searchInput"
        type="text"
        placeholder="PDF में खोजें..."
    >

    <button id="searchPrev">
        ↑
    </button>

    <button id="searchNext">
        ↓
    </button>

    <button id="searchClose">
        ✕
    </button>

</div>



<!-- ================= STATUS ================= -->

<div
    id="status"
    class="status"
>
    PDF खोलने के लिए 📂 दबाएँ
</div>



<!-- ================= PDF VIEWER ================= -->

<main
    id="viewerContainer"
    class="viewer-container"
>


    <div
        id="welcome"
        class="welcome"
    >

        <div class="welcome-icon">
            📄
        </div>

        <h2>
            PDF Viewer
        </h2>

        <p>
            अपनी PDF चुनें और ब्राउज़र में खोलें।
        </p>


        <label
            for="pdfInput"
            class="open-pdf-btn"
        >
            📂 Choose PDF
        </label>

    </div>


    <!-- PDF pages -->

    <div
        id="pdfContainer"
        class="pdf-container"
    ></div>


</main>



<!-- ================= TEXT POPUP ================= -->

<div
    id="textPopup"
    class="popup"
    hidden
>

    <div class="popup-box">

        <h3>
            Text जोड़ें
        </h3>


        <textarea
            id="textInput"
            placeholder="यहाँ text लिखें..."
        ></textarea>


        <div class="popup-row">

            <button
                id="addTextBtn"
                class="popup-btn"
            >
                Add
            </button>


            <button
                id="cancelTextBtn"
                class="popup-btn cancel"
            >
                Cancel
            </button>

        </div>

    </div>

</div>



<!-- ================= PDF LIB ================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"
>
</script>


<!-- ================= PDF.JS ================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
>
</script>


<!-- ================= OUR SCRIPT ================= -->

<script src="script.js"></script>


</body>

    </html>
