<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>SSODAYS PDF Editor</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#29282d;
}

body{
    display:flex;
    flex-direction:column;
}


/* ================= TOP BAR ================= */

.topbar{

    height:58px;
    flex:0 0 58px;

    background:#174b7d;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    font-size:20px;
    font-weight:bold;
}

.topbar button{

    background:white;
    color:#222;

    border:0;
    border-radius:7px;

    padding:9px 14px;

    font-size:15px;

    cursor:pointer;
}


/* ================= TOOL BAR ================= */

.editorbar{

    min-height:52px;

    background:#323136;

    border-bottom:1px solid #111;

    display:flex;
    align-items:center;

    gap:5px;

    padding:5px;

    overflow-x:auto;
    white-space:nowrap;
}

.editorbar button,
.editorbar label{

    height:40px;
    min-width:40px;

    border:0;
    border-radius:5px;

    background:#3d3c42;
    color:#eee;

    font-size:15px;

    cursor:pointer;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:0 10px;
}

.editorbar button:hover,
.editorbar label:hover{

    background:#55535a;
}

.editorbar input[type=file]{
    display:none;
}

.sep{

    height:30px;
    width:1px;

    background:#666;

    margin:0 3px;
}

#pageInput{

    width:55px;
    height:36px;

    text-align:center;
}

#textSize{

    width:55px;
    height:36px;

    background:#3d3c42;
    color:white;

    border:1px solid #666;
    border-radius:5px;

    text-align:center;
}


/* ================= VIEWER ================= */

#viewerContainer{

    position:relative;

    flex:1;

    overflow:hidden;

    background:#29282d;
}

#pdfFrame{

    width:100%;
    height:100%;

    border:0;

    background:white;

    display:none;
}

#empty{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#aaa;

    font-size:17px;

    text-align:center;

    padding:25px;
}

#emptyBox{

    background:#333239;

    border:1px solid #4b4a50;

    border-radius:12px;

    padding:30px 22px;

    max-width:420px;
}

#emptyBox b{

    display:block;

    color:white;

    font-size:24px;

    margin-bottom:12px;
}


/* ================= STATUS ================= */

#status{

    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    background:#111;

    color:white;

    padding:8px 14px;

    border-radius:20px;

    font-size:14px;

    z-index:100;

    display:none;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .topbar{

        height:52px;
        flex-basis:52px;

        font-size:17px;

        padding:0 10px;
    }

    .topbar button{

        padding:7px 10px;
        font-size:13px;
    }

    .editorbar{

        min-height:48px;
        padding:4px;
    }

    .editorbar button,
    .editorbar label{

        height:38px;
        min-width:38px;

        padding:0 8px;

        font-size:14px;
    }

}

</style>

</head>


<body>


<!-- ================= TOP ================= -->

<div class="topbar">

    <span>
        📄 PDF Editor
    </span>

    <button id="closeBtn">
        ✕ Close
    </button>

</div>



<!-- ================= TOOLS ================= -->

<div class="editorbar">


    <!-- PDF OPEN -->

    <label title="Open PDF">

        📂 PDF

        <input
            id="pdfInput"
            type="file"
            accept=".pdf,application/pdf,application/octet-stream"
        >

    </label>



    <!-- PAGE -->

    <button id="prevBtn"
            title="Previous Page">

        ◀

    </button>


    <input
        id="pageInput"
        type="number"
        min="1"
        value="1"
    >


    <span style="color:#ddd">

        /
        <span id="pageCount">
            0
        </span>

    </span>


    <button id="nextBtn"
            title="Next Page">

        ▶

    </button>



    <!-- ZOOM -->

    <button id="zoomOutBtn"
            title="Zoom Out">

        −

    </button>


    <button id="zoomInBtn"
            title="Zoom In">

        +

    </button>


    <button id="fitBtn"
            title="Fit">

        ↔

    </button>



    <span class="sep"></span>



    <!-- EDITING TOOLS -->

    <button id="pencilBtn"
            title="Pencil">

        ✎

    </button>


    <button id="highlightBtn"
            title="Highlight">

        🖍

    </button>


    <button id="textBtn"
            title="Text">

        T

    </button>


    <!-- IMAGE -->

    <label title="Add Image">

        🖼

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

    </label>


    <!-- UNDO -->

    <button id="undoBtn"
            title="Undo">

        ↶

    </button>


    <!-- CLEAR -->

    <button id="clearBtn"
            title="Clear">

        🗑

    </button>


    <!-- DOWNLOAD -->

    <button id="downloadBtn"
            title="Download">

        ⬇

    </button>



    <span class="sep"></span>


    <span style="
        color:#bbb;
        font-size:13px;
    ">

        Text

    </span>


    <input
        id="textSize"
        type="number"
        min="8"
        max="120"
        value="20"
    >

</div>



<!-- ================= PDF VIEWER ================= -->

<div id="viewerContainer">


    <iframe
        id="pdfFrame"
        title="PDF Viewer">
    </iframe>


    <div id="empty">


        <div id="emptyBox">


            <b>
                PDF Viewer
            </b>


            PDF चुनें और browser में देखें।


            <br><br>


            📂 ऊपर
            <b style="
                display:inline;
                font-size:18px;
            ">
                PDF
            </b>

            बटन दबाकर PDF चुनें।


            <br><br>


            <span style="
                font-size:14px;
            ">

                PDF server पर upload नहीं होगी।

            </span>


        </div>


    </div>


</div>



<div id="status"></div>



<!-- ================= PDF LIB ================= -->

<script src="
https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js
"></script>



<script>


/* ================= VARIABLES ================= */

let currentFile = null;

let currentPDFObjectURL = null;

let pdfBytes = null;

let currentPage = 1;

let totalPages = 0;

let selectedTool = null;

let zoomLevel = 1;

let undoStack = [];



/* ================= SHORTCUT ================= */

const $ = id =>
    document.getElementById(id);



/* ================= STATUS ================= */

function toast(message){

    const box =
        $("status");

    box.textContent =
        message;

    box.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(()=>{

            box.style.display =
                "none";

        },2500);

}



/* ================= OPEN PDF ================= */

async function loadPDF(file){

    if(!file){

        toast(
            "PDF file चुनें"
        );

        return;
    }


    const fileName =
        (
            file.name || ""
        ).toLowerCase();


    const fileType =
        (
            file.type || ""
        ).toLowerCase();


    /*
       Android में कभी-कभी
       MIME type खाली आता है।
       इसलिए filename भी check कर रहे हैं।
    */

    if(

        !fileName.endsWith(".pdf")

        &&

        fileType !== "application/pdf"

        &&

        fileType !== "application/octet-stream"

        &&

        fileType !== ""

    ){

        alert(
            "कृपया PDF file ही चुनें।"
        );

        return;
    }



    try{


        toast(
            "PDF load हो रही है..."
        );


        /*
           Read file locally.
           Server पर upload नहीं होगा।
        */

        const buffer =
            await file.arrayBuffer();


        pdfBytes =
            new Uint8Array(buffer);


        /*
           Check PDF signature.
        */

        const firstBytes =
            new TextDecoder()
            .decode(
                pdfBytes.slice(0,5)
            );


        if(
            firstBytes !== "%PDF-"
        ){

            alert(
                "यह valid PDF file नहीं है।"
            );

            return;
        }


        currentFile =
            file;


        /*
           Previous local URL remove.
        */

        if(
            currentPDFObjectURL
        ){

            URL.revokeObjectURL(
                currentPDFObjectURL
            );

        }


        /*
           Create local browser URL.
        */

        const blob =
            new Blob(
                [pdfBytes],
                {
                    type:
                    "application/pdf"
                }
            );


        currentPDFObjectURL =
            URL.createObjectURL(
                blob
            );


        /*
           IMPORTANT:

           PDF को बाहरी Mozilla
           viewer में नहीं भेज रहे।

           Direct browser PDF viewer
           में local PDF खोल रहे हैं।
        */

        const frame =
            $("pdfFrame");


        frame.src =
            currentPDFObjectURL;


        frame.style.display =
            "block";


        $("empty").style.display =
            "none";


        /*
           Page count निकालने की कोशिश।
           PDF.js की जरूरत नहीं।
        */

        totalPages =
            countPDFPages(
                pdfBytes
            );


        $("pageCount").textContent =
            totalPages || "?";


        $("pageInput").value =
            1;


        currentPage =
            1;


        toast(
            "PDF खुल गई"
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "PDF खोलते समय error आया।"
        );


        toast(
            "PDF open नहीं हुई"
        );

    }

}



/* ================= PDF PAGE COUNT ================= */

/*
   Simple page counter.
   यह केवल page navigation display
   के लिए है।
*/

function countPDFPages(bytes){

    try{

        const text =
            new TextDecoder(
                "latin1"
            ).decode(bytes);


        const matches =
            text.match(
                /\/Type\s*\/Page\b/g
            );


        if(matches){

            return matches.length;

        }

    }catch(e){

        console.warn(e);

    }


    return 0;

}



/* ================= FILE INPUT ================= */

$("pdfInput")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        /*
           Input reset इसलिए
           ताकि same PDF दोबारा भी
           select की जा सके।
        */

        event.target.value = "";


        if(file){

            await loadPDF(
                file
            );

        }

    }
);



/* ================= PREVIOUS ================= */

$("prevBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    if(
        currentPage > 1
    ){

        currentPage--;

        $("pageInput").value =
            currentPage;

        toast(
            "Page " +
            currentPage
        );

    }

};



/* ================= NEXT ================= */

$("nextBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    if(
        totalPages &&
        currentPage < totalPages
    ){

        currentPage++;

        $("pageInput").value =
            currentPage;

        toast(
            "Page " +
            currentPage
        );

    }

};



/* ================= PAGE INPUT ================= */

$("pageInput")
.addEventListener(
    "change",
    function(){

        if(!currentFile)
            return;


        let page =
            Number(
                $("pageInput").value
            );


        if(!page || page < 1)
            page = 1;


        if(
            totalPages &&
            page > totalPages
        ){

            page =
                totalPages;

        }


        currentPage =
            page;


        $("pageInput").value =
            page;

    }
);



/* ================= ZOOM ================= */

$("zoomInBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    zoomLevel += 0.1;


    /*
       Browser viewer का zoom
       browser controlled है।
    */

    toast(
        "Zoom " +
        Math.round(
            zoomLevel * 100
        ) +
        "%"
    );

};



$("zoomOutBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    zoomLevel =
        Math.max(
            0.5,
            zoomLevel - 0.1
        );


    toast(
        "Zoom " +
        Math.round(
            zoomLevel * 100
        ) +
        "%"
    );

};



$("fitBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    toast(
        "Browser PDF viewer में Fit option इस्तेमाल करें"
    );

};



/* ================= PENCIL ================= */

$("pencilBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    selectedTool =
        "pencil";


    toast(
        "✎ Pencil selected"
    );

};



/* ================= HIGHLIGHT ================= */

$("highlightBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    selectedTool =
        "highlight";


    toast(
        "🖍 Highlight selected"
    );

};



/* ================= TEXT ================= */

$("textBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    selectedTool =
        "text";


    toast(
        "T Text selected"
    );

};



/* ================= IMAGE ================= */

$("imageInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        event.target.value = "";


        if(!file)
            return;


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "सिर्फ image चुनें।"
            );

            return;
        }


        toast(
            "Image selected"
        );

    }
);



/* ================= UNDO ================= */

$("undoBtn").onclick =
function(){

    if(
        undoStack.length
    ){

        undoStack.pop();

        toast(
            "Undo"
        );

    }else{

        toast(
            "Undo करने के लिए कुछ नहीं है"
        );

    }

};



/* ================= CLEAR ================= */

$("clearBtn").onclick =
function(){

    if(!currentFile){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    if(
        confirm(
            "क्या current editing हटानी है?"
        )
    ){

        undoStack = [];


        toast(
            "Editing clear हो गई"
        );

    }

};



/* ================= DOWNLOAD ================= */

$("downloadBtn").onclick =
async function(){

    if(!pdfBytes){

        toast(
            "पहले PDF चुनें"
        );

        return;
    }


    try{


        toast(
            "PDF तैयार हो रही है..."
        );


        /*
           Original PDF को
           PDF-LIB से save करते हैं।
        */

        const pdfDoc =
            await PDFLib
            .PDFDocument
            .load(
                pdfBytes
            );


        const output =
            await pdfDoc.save();


        const blob =
            new Blob(
                [output],
                {
                    type:
                    "application/pdf"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        const originalName =
            currentFile &&
            currentFile.name
            ?
            currentFile.name
            :
            "document.pdf";


        a.download =
            originalName.replace(
                /\.pdf$/i,
                ""
            ) +
            "_edited.pdf";


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            3000
        );


        toast(
            "PDF download हो गई"
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "PDF download करते समय error आया।"
        );

    }

};



/* ================= CLOSE ================= */

$("closeBtn").onclick =
function(){

    if(
        currentPDFObjectURL
    ){

        URL.revokeObjectURL(
            currentPDFObjectURL
        );


        currentPDFObjectURL =
            null;

    }


    $("pdfFrame").src =
        "";


    location.href =
        "../index.html";

};



/* ================= PAGE LEAVE ================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            currentPDFObjectURL
        ){

            URL.revokeObjectURL(
                currentPDFObjectURL
            );

        }

    }
);


</script>

</body>

    </html>
