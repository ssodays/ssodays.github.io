<style>
*{box-sizing:border-box}

html,body{
margin:0;
height:100%;
font-family:Arial,sans-serif;
background:#525659;
overflow:hidden;
}

.topbar{
height:58px;
background:#0d477d;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
position:relative;
z-index:100;
}

.title{
font-size:20px;
font-weight:700;
}

.top-btn{
border:0;
background:#fff;
color:#163d63;
border-radius:8px;
padding:11px 15px;
font-size:16px;
font-weight:700;
}

.toolbar{
height:58px;
background:#333;
display:flex;
align-items:center;
gap:7px;
padding:7px 10px;
overflow-x:auto;
white-space:nowrap;
position:relative;
z-index:100;
}

.tool-btn{
border:0;
background:#444;
color:#fff;
border-radius:7px;
padding:10px 13px;
font-size:15px;
min-height:42px;
flex-shrink:0;
}

.tool-btn.active{
background:#0d6efd;
}

.tool-btn.download{
background:#198754;
}

.tool-btn.danger{
background:#a83232;
}

.file-btn{
display:inline-flex;
align-items:center;
cursor:pointer;
}

.page-input{
width:72px;
height:42px;
border:0;
border-radius:7px;
text-align:center;
font-size:18px;
flex-shrink:0;
}

.page-total{
color:#fff;
font-size:17px;
}

#status{
position:absolute;
left:0;
right:0;
top:116px;
z-index:80;
background:#222;
color:#fff;
text-align:center;
padding:5px;
font-size:13px;
}

#viewerContainer{
position:absolute;
top:116px;
bottom:0;
left:0;
right:0;
overflow:auto;
background:#525659;
-webkit-overflow-scrolling:touch;
}

#viewer{
padding-bottom:40px;
}

#viewer .page{
position:relative;
margin:8px auto;
}

#viewer .canvasWrapper{
overflow:visible!important;
}

#viewer canvas{
image-rendering:auto;
}

.edit-overlay{
position:absolute;
inset:0;
z-index:20;
pointer-events:none;
}

.draw-canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.edit-item{
position:absolute;
pointer-events:auto;
user-select:none;
}

.edit-text{
color:#111;
white-space:pre-wrap;
cursor:move;
font-family:Arial,sans-serif;
padding:2px;
}

.edit-image-wrap{
border:1px dashed transparent;
cursor:move;
}

.edit-image-wrap.selected{
border:2px dashed #0d6efd;
}

.edit-image-wrap img{
display:block;
width:100%;
height:100%;
object-fit:contain;
}

.resize-handle{
position:absolute;
width:16px;
height:16px;
right:-8px;
bottom:-8px;
background:#0d6efd;
border-radius:50%;
display:none;
cursor:nwse-resize;
}

.edit-image-wrap.selected .resize-handle{
display:block;
}

#welcome{
position:absolute;
z-index:90;
top:116px;
left:0;
right:0;
bottom:0;
background:#525659;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.welcome-box{
background:#fff;
border-radius:22px;
padding:40px 24px;
text-align:center;
width:min(92%,600px);
box-shadow:0 8px 30px #0005;
}

.welcome-icon{
font-size:65px;
}

.welcome-box h1{
color:#123f70;
margin:8px 0;
font-size:38px;
}

.welcome-box p{
font-size:21px;
color:#555;
}

.choose-btn{
display:inline-block;
background:#123f70;
color:#fff;
padding:15px 25px;
border-radius:9px;
font-size:20px;
cursor:pointer;
}

.welcome-box small{
display:block;
margin-top:25px;
color:#777;
font-size:16px;
}

#toast{
position:fixed;
left:50%;
bottom:20px;
transform:translateX(-50%);
background:#222;
color:#fff;
padding:10px 16px;
border-radius:8px;
z-index:200;
display:none;
}

@media(max-width:600px){

.title{
font-size:17px;
}

.top-btn{
font-size:14px;
padding:9px 12px;
}

.welcome-box{
padding:30px 18px;
}

.welcome-box h1{
font-size:30px;
}

.welcome-box p{
font-size:18px;
}

}
</style>
</head>

</h1>

</p>

<input

</small>

<div id="toast"></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>

"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const $ = id =>
document.getElementById(id);


const viewerContainer =
$("viewerContainer");

const viewer =
$("viewer");

const welcome =
$("welcome");

const status =
$("status");

const pageNumber =
$("pageNumber");

const pageCount =
$("pageCount");


const eventBus =
new pdfjsViewer.EventBus();


const linkService =
new pdfjsViewer.PDFLinkService({
eventBus:eventBus
});


const pdfViewer =
new pdfjsViewer.PDFViewer({

container:viewerContainer,

viewer:viewer,

eventBus:eventBus,

linkService:linkService,

textLayerMode:1,

annotationMode:2,

maxCanvasPixels:16777216,

enableHWA:true

});


linkService.setViewer(pdfViewer);


let pdfDocument=null;
let pdfBytes=null;
let currentPage=1;
let currentTool=null;
let pages={};
let history=[];
let drawing=null;


function msg(text){

status.textContent=text;

}


function toast(text){

const box=$("toast");

box.textContent=text;

box.style.display="block";

clearTimeout(toast.timer);

toast.timer=setTimeout(
()=>{
box.style.display="none";
},
2200
);

}


function state(number){

if(!pages[number]){

pages[number]={
strokes:[],
texts:[],
images:[],
overlay:null
};

}

return pages[number];

}


function overlayFor(pageDiv){

const number=
Number(pageDiv.dataset.pageNumber);

if(!number)
return null;

let overlay=
pageDiv.querySelector(".edit-overlay");

if(!overlay){

overlay=
document.createElement("div");

overlay.className="edit-overlay";

pageDiv.appendChild(overlay);

state(number).overlay=overlay;

overlay.addEventListener(
"pointerdown",
function(e){

if(
currentTool==="pencil" ||
currentTool==="highlight"
){

drawStart(
e,
number,
overlay
);

}

}
);

}else{

state(number).overlay=overlay;

}

return overlay;

}


function prepare(){

document
.querySelectorAll("#viewer .page")
.forEach(overlayFor);

}


eventBus.on(
"pagesinit",
function(){

pageCount.textContent=
pdfDocument.numPages;

pdfViewer.currentPageNumber=1;

pdfViewer.currentScaleValue=
"page-width";

prepare();

msg("✅ PDF खुल गई।");

}
);


eventBus.on(
"pagechanging",
function(e){

currentPage=e.pageNumber;

pageNumber.value=e.pageNumber;

prepare();

}
);


eventBus.on(
"pagerendered",
function(e){

const page=
document.querySelector(
'#viewer .page[data-page-number="'+
e.pageNumber+
'"]'
);

if(page){

overlayFor(page);

restore(e.pageNumber);

}

}
);


eventBus.on(
"scalechanging",
function(){

setTimeout(
function(){

prepare();

for(const n in pages){

restore(Number(n));

}

},
150
);

};


async function loadPDF(file){

if(!file)
return;

if(
!file.name.toLowerCase().endsWith(".pdf")
){

alert("कृपया PDF file चुनें।");

return;

}

try{

msg("PDF load हो रही है...");

const buffer=
await file.arrayBuffer();

pdfBytes=
new Uint8Array(buffer);

pages={};

history=[];

currentPage=1;

const task=
pdfjsLib.getDocument({
data:pdfBytes,
disableAutoFetch:false,
disableStream:false
});

pdfDocument=
await task.promise;

welcome.style.display="none";

pdfViewer.setDocument(pdfDocument);

linkService.setDocument(
pdfDocument,
null
);

pageCount.textContent=
pdfDocument.numPages;

pageNumber.value=1;

msg("✅ PDF खुल गई।");

toast("PDF successfully open हो गई");

}catch(error){

console.error(error);

pdfDocument=null;

pdfBytes=null;

pageCount.textContent="0";

welcome.style.display="flex";

msg("❌ PDF open नहीं हो पाई।");

alert(
"PDF open नहीं हो पाई। दूसरी PDF से test करें।"
);

}

}
function drawStart(event,number,overlay){

event.preventDefault();

const rect=overlay.getBoundingClientRect();

drawing={
number:number,
overlay:overlay,
type:currentTool,
points:[{
x:(event.clientX-rect.left)/rect.width,
y:(event.clientY-rect.top)/rect.height
}],
canvas:document.createElement("canvas")
};

const canvas=drawing.canvas;

canvas.className="draw-canvas";

canvas.width=Math.max(
1,
Math.round(rect.width)
);

canvas.height=Math.max(
1,
Math.round(rect.height)
);

overlay.appendChild(canvas);

drawPreview();

overlay.setPointerCapture?.(
event.pointerId
);

overlay.addEventListener(
"pointermove",
drawMove
);

overlay.addEventListener(
"pointerup",
drawEnd,
{once:true}
);

overlay.addEventListener(
"pointercancel",
drawEnd,
{once:true}
);

}


function drawMove(event){

if(!drawing)
return;

const rect=
drawing.overlay.getBoundingClientRect();

drawing.points.push({

x:(event.clientX-rect.left)/rect.width,

y:(event.clientY-rect.top)/rect.height

});

drawPreview();

}


function drawEnd(){

if(!drawing)
return;

const s=
state(drawing.number);

const object={
type:drawing.type,
points:drawing.points.slice()
};

s.strokes.push(object);

history.push({
page:drawing.number,
type:"stroke",
object:object
});

drawing.overlay.removeEventListener(
"pointermove",
drawMove
);

drawing=null;

}


function drawPreview(){

if(!drawing)
return;

const canvas=drawing.canvas;

const ctx=
canvas.getContext("2d");

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.lineCap="round";
ctx.lineJoin="round";

if(drawing.type==="highlight"){

ctx.strokeStyle=
"rgba(255,230,0,.35)";

ctx.lineWidth=20;

}else{

ctx.strokeStyle="#111";

ctx.lineWidth=3;

}

ctx.beginPath();

drawing.points.forEach(
function(point,index){

const x=
point.x*canvas.width;

const y=
point.y*canvas.height;

if(index===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

}
);

ctx.stroke();

}


function restore(number){

const s=state(number);

const overlay=s.overlay;

if(!overlay)
return;

overlay
.querySelectorAll(
".draw-canvas,.edit-item"
)
.forEach(
element=>element.remove()
);


s.strokes.forEach(
function(stroke){

const rect=
overlay.getBoundingClientRect();

const canvas=
document.createElement("canvas");

canvas.className="draw-canvas";

canvas.width=
Math.max(
1,
Math.round(rect.width)
);

canvas.height=
Math.max(
1,
Math.round(rect.height)
);

const ctx=
canvas.getContext("2d");

ctx.lineCap="round";
ctx.lineJoin="round";

if(stroke.type==="highlight"){

ctx.strokeStyle=
"rgba(255,230,0,.35)";

ctx.lineWidth=20;

}else{

ctx.strokeStyle="#111";

ctx.lineWidth=3;

}

ctx.beginPath();

stroke.points.forEach(
function(point,index){

const x=
point.x*canvas.width;

const y=
point.y*canvas.height;

if(index===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

}
);

ctx.stroke();

overlay.appendChild(canvas);

}
);


s.texts.forEach(
function(text){

createText(
text,
overlay
);

}
);


s.images.forEach(
function(image){

createImage(
image,
overlay
);

}
);

}


function createText(
object,
overlay
){

const element=
document.createElement("div");

element.className=
"edit-item edit-text";

element.textContent=
object.text;

element.style.left=
(object.x*100)+"%";

element.style.top=
(object.y*100)+"%";

element.style.fontSize=
object.size+"px";

element.style.zIndex="30";

overlay.appendChild(element);

makeMovable(
element,
object,
overlay
);

return element;

}


function createImage(
object,
overlay
){

const wrapper=
document.createElement("div");

wrapper.className=
"edit-item edit-image-wrap";

wrapper.style.left=
(object.x*100)+"%";

wrapper.style.top=
(object.y*100)+"%";

wrapper.style.width=
(object.w*100)+"%";

wrapper.style.height=
(object.h*100)+"%";

wrapper.style.zIndex="30";


const image=
document.createElement("img");

image.src=
object.src;

image.style.width="100%";

image.style.height="100%";

image.style.objectFit="contain";


const handle=
document.createElement("div");

handle.className=
"resize-handle";


wrapper.appendChild(image);

wrapper.appendChild(handle);

overlay.appendChild(wrapper);


makeMovable(
wrapper,
object,
overlay
);

makeResizable(
wrapper,
object,
overlay
);

return wrapper;

}


function makeMovable(
element,
object,
overlay
){

element.addEventListener(
"pointerdown",
function(event){

if(currentTool)
return;

event.preventDefault();

event.stopPropagation();

const rect=
overlay.getBoundingClientRect();

const startX=
event.clientX;

const startY=
event.clientY;

const oldX=
object.x;

const oldY=
object.y;


function move(e){

object.x=
Math.max(
0,
Math.min(
.95,
oldX+
(e.clientX-startX)/
rect.width
)
);

object.y=
Math.max(
0,
Math.min(
.95,
oldY+
(e.clientY-startY)/
rect.height
)
);

element.style.left=
(object.x*100)+"%";

element.style.top=
(object.y*100)+"%";

}


function up(){

document.removeEventListener(
"pointermove",
move
);

document.removeEventListener(
"pointerup",
up
);

}


document.addEventListener(
"pointermove",
move
);

document.addEventListener(
"pointerup",
up
);

}
);

}


function makeResizable(
element,
object,
overlay
){

const handle=
element.querySelector(
".resize-handle"
);

if(!handle)
return;


handle.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

event.stopPropagation();

const rect=
overlay.getBoundingClientRect();

const startX=
event.clientX;

const startY=
event.clientY;

const oldW=
object.w;

const oldH=
object.h;


function move(e){

object.w=
Math.max(
.05,
Math.min(
.9,
oldW+
(e.clientX-startX)/
rect.width
)
);

object.h=
Math.max(
.05,
Math.min(
.9,
oldH+
(e.clientY-startY)/
rect.height
)
);

element.style.width=
(object.w*100)+"%";

element.style.height=
(object.h*100)+"%";

  }
  function up(){

document.removeEventListener(
"pointermove",
move
);

document.removeEventListener(
"pointerup",
up
);

}


document.addEventListener(
"pointermove",
move
);

document.addEventListener(
"pointerup",
up
);

}
);

}


function selectTool(tool){

currentTool=
currentTool===tool
?null
:tool;

$("pencilBtn")
.classList.remove("active");

$("highlightBtn")
.classList.remove("active");


if(currentTool==="pencil"){

$("pencilBtn")
.classList.add("active");

}


if(currentTool==="highlight"){

$("highlightBtn")
.classList.add("active");

}


msg(
currentTool
?"Tool: "+currentTool
:"Tool बंद है।"
);

}


function addText(){

if(!pdfDocument){

alert(
"पहले PDF चुनें।"
);

return;

}


const text=
prompt(
"PDF में क्या text लिखना है?"
);

if(!text)
return;


const size=
Number(
prompt(
"Text size (12/18/26/36)",
"18"
)
)||18;


const object={
text:text,
x:.10,
y:.10,
size:size
};


const s=
state(currentPage);

s.texts.push(object);

history.push({
page:currentPage,
type:"text",
object:object
});


restore(currentPage);

}


function addImage(file){

if(!pdfDocument){

alert(
"पहले PDF चुनें।"
);

return;

}


const reader=
new FileReader();


reader.onload=
function(){

const object={

src:reader.result,

x:.10,

y:.10,

w:.30,

h:.20

};


state(currentPage)
.images
.push(object);


history.push({

page:currentPage,

type:"image",

object:object

});


restore(currentPage);

toast(
"Image जोड़ दी गई।"
);

};


reader.readAsDataURL(file);

}


function undo(){

const item=
history.pop();


if(!item){

toast(
"Undo करने के लिए कुछ नहीं है।"
);

return;

}


const s=
state(item.page);

let array;


if(item.type==="stroke"){

array=s.strokes;

}else if(item.type==="text"){

array=s.texts;

}else{

array=s.images;

}


const index=
array.indexOf(
item.object
);


if(index!==-1){

array.splice(
index,
1
);

}


restore(item.page);

}


function clearPage(){

if(!pdfDocument)
return;


const s=
state(currentPage);

s.strokes=[];

s.texts=[];

s.images=[];


history=
history.filter(
item=>
item.page!==currentPage
);


restore(currentPage);

toast(
"इस page की editing clear हो गई।"
);

}


async function downloadPDF(){

if(!pdfBytes){

alert(
"पहले PDF चुनें।"
);

return;

}


try{

msg(
"Edited PDF तैयार हो रही है..."
);


const doc=
await PDFLib.PDFDocument.load(
pdfBytes
);


const pdfPages=
doc.getPages();


for(
let n=1;
n<=pdfPages.length;
n++
){

const s=pages[n];

if(!s)
continue;


const pdfPage=
pdfPages[n-1];

const W=
pdfPage.getWidth();

const H=
pdfPage.getHeight();


for(
const stroke of s.strokes
){

if(
stroke.points.length<2
)
continue;


for(
let i=1;
i<stroke.points.length;
i++
){

const a=
stroke.points[i-1];

const b=
stroke.points[i];


pdfPage.drawLine({

start:{
x:a.x*W,
y:H-a.y*H
},

end:{
x:b.x*W,
y:H-b.y*H
},

thickness:
stroke.type==="highlight"
?12
:2.5,

color:
stroke.type==="highlight"
?
PDFLib.rgb(1,.9,0)
:
PDFLib.rgb(.05,.05,.05),

opacity:
stroke.type==="highlight"
?.35
:1

});

}

}


for(
const text of s.texts
){

pdfPage.drawText(
text.text,
{

x:text.x*W,

y:
H-
text.y*H-
text.size,

size:text.size,

color:
PDFLib.rgb(0,0,0)

}
);

  }
  for(
const image of s.images
){

try{

await fetch(
image.src
)
.then(
response=>
response.arrayBuffer()
);


let embedded;

)
){

);

);

}
);

);

}

}

}

await doc.save();

new Blob(
[output],
{

}
);

blob
);


const link=
document.createElement("a");

link.download=
"SSODAYS-Edited.pdf";

link.click();

link.remove();

$("prevBtn").onclick =
function(){

if(!pdfDocument)
return;

pdfViewer.currentPageNumber =
Math.max(
1,
pdfViewer.currentPageNumber-1
);

};


$("nextBtn").onclick =
function(){

if(!pdfDocument)
return;

pdfViewer.currentPageNumber =
Math.min(
pdfDocument.numPages,
pdfViewer.currentPageNumber+1
);

};


pageNumber.addEventListener(
"change",
function(){

if(!pdfDocument)
return;

let number =
Number(pageNumber.value)||1;

number =
Math.max(
1,
Math.min(
pdfDocument.numPages,
number
)
);

pdfViewer.currentPageNumber =
number;

}
);
